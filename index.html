<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="전자칠판부터 건강식품, 헬스케어기기, 렌탈까지. 라이프케어서비스가 취급하는 상품과 납품 사례를 소개합니다.">
<meta property="og:title" content="라이프케어서비스">
<meta property="og:description" content="취급 상품과 실제 납품·설치 사례를 한곳에서 보세요.">
<title>라이프케어서비스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --outer:#E9EEEA; --ground:#F7F9F7; --surface:#FFFFFF; --soft:#EDF2EE; --line:#DCE4DE;
  --ink:#1D2724; --muted:#5E6C66; --accent:#2E6B58; --accent-ink:#FFFFFF;
  --accent-soft:#DCEBE3; --warm:#B0612B; --warm-soft:#F6E8DC;
  --store:#03C75A; --store-ink:#FFFFFF;
  --t1:#CFE3D8; --t2:#E8DCC8; --t3:#D5DCEB; --t4:#EAD6D6; --t5:#DDE6C9; --t6:#E2D9EA;
  --bar-h:64px; --tabs-h:48px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --outer:#0E1311; --ground:#141A18; --surface:#1C2421; --soft:#222C28; --line:#33403A;
    --ink:#E6ECE8; --muted:#9DAAA4; --accent:#7CC2A8; --accent-ink:#10201A;
    --accent-soft:#24372F; --warm:#E3A06F; --warm-soft:#3A2B20;
    --t1:#27392F; --t2:#3A3326; --t3:#2A3040; --t4:#3B2B2B; --t5:#303923; --t6:#342C3D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --outer:#0E1311; --ground:#141A18; --surface:#1C2421; --soft:#222C28; --line:#33403A;
  --ink:#E6ECE8; --muted:#9DAAA4; --accent:#7CC2A8; --accent-ink:#10201A;
  --accent-soft:#24372F; --warm:#E3A06F; --warm-soft:#3A2B20;
  --t1:#27392F; --t2:#3A3326; --t3:#2A3040; --t4:#3B2B2B; --t5:#303923; --t6:#342C3D;
}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%;display:block}
[hidden]{display:none!important}
body{background:var(--outer);color:var(--ink);font:15px/1.6 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;text-wrap:balance;margin:0;line-height:1.3}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:520px;margin:0 auto;background:var(--ground);min-height:100vh;padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom,0px) + 16px)}
@media (min-width:560px){.app{border-inline:1px solid var(--line)}}

/* 헤더 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px}
.brand{display:flex;align-items:center;gap:9px;font-family:"IBM Plex Sans KR",sans-serif;font-weight:700;font-size:17px;text-decoration:none}
.mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.mark svg{width:16px;height:16px}
.top-links{display:flex;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;text-decoration:none;font-weight:500}

/* 소개 */
.intro{padding:6px 16px 18px;display:grid;gap:10px}
.intro h1{font-size:23px;font-weight:700;letter-spacing:-.01em}
.intro h1 em{font-style:normal;color:var(--accent)}
.intro p{margin:0;color:var(--muted);font-size:14px}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.fact{background:var(--soft);border-radius:8px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.fact b{color:var(--ink);font-variant-numeric:tabular-nums}

/* 카테고리 탭바 */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs-inner{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-inline:10px;height:var(--tabs-h);align-items:stretch}
.tabs-inner::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;padding:0 11px;font-size:14.5px;font-weight:500;color:var(--muted);position:relative;white-space:nowrap}
.tab[aria-current="true"]{color:var(--ink);font-weight:700}
.tab[aria-current="true"]::after{content:"";position:absolute;left:11px;right:11px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.tab .n{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:3px;font-variant-numeric:tabular-nums}

/* 상품 목록 */
.cat-sec,.sec{scroll-margin-top:calc(var(--tabs-h) + env(safe-area-inset-top,0px))}
.cat-sec{padding-top:22px}
.cat-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-inline:16px;margin-bottom:6px}
.cat-head h2{font-size:18px}
.cat-head span{font-size:12.5px;color:var(--muted)}
.list{display:grid;padding-inline:16px}
.item{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line);text-decoration:none}
.list .item:last-child{border-bottom:0}
.item:active{background:var(--soft)}
.thumb{aspect-ratio:1;width:100%;max-width:100%;border-radius:12px;display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.glyph{font-family:"IBM Plex Sans KR",sans-serif;font-weight:700;color:var(--ink);opacity:.45;font-size:14px;text-align:center;line-height:1.3;padding:6px}
.info{display:grid;gap:2px;min-width:0}
.info h3{font-size:15px;font-weight:600;font-family:"Noto Sans KR",sans-serif}
.sum{font-size:12.5px;color:var(--muted)}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.price small{font-weight:400;color:var(--muted);font-size:12px}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:1px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.badge.rental{background:var(--warm-soft);color:var(--warm)}
.badge.muted{background:var(--soft);color:var(--muted)}

/* 공통 섹션 */
.sec{padding-top:30px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-inline:16px;margin-bottom:10px}
.sec-head h2{font-size:18px}
.sec-head a{font-size:13px;color:var(--accent);text-decoration:none;font-weight:500;white-space:nowrap}
.sec-sub{padding-inline:16px;margin:-4px 0 12px;font-size:13px;color:var(--muted)}

/* 블로그 사례 카드 */
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-inline:16px;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .case{flex:0 0 80%;scroll-snap-align:start}
.cases{display:grid;gap:12px;padding-inline:16px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;display:grid}
.case .cover{aspect-ratio:16/9;max-width:100%;display:grid;place-items:center}
.case .cover img{width:100%;height:100%;object-fit:cover}
.case .body{padding:12px 14px 14px;display:grid;gap:5px}
.case .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.case h3{font-size:15px}
.case p{margin:0;font-size:13px;color:var(--muted)}
.case .more{font-size:12.5px;color:var(--accent);font-weight:500}

/* 관련 소식 */
.news{display:grid;padding-inline:16px}
.news a{display:grid;gap:2px;padding-block:11px;border-bottom:1px solid var(--line);text-decoration:none}
.news a:last-child{border-bottom:0}
.news b{font-size:14px;font-weight:500}
.news span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.auto-note{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--warm);background:var(--warm-soft);border-radius:6px;padding:2px 8px}

/* 상품 상세 페이지 */
.back{display:inline-flex;align-items:center;gap:4px;margin:4px 16px 10px;background:none;border:0;padding:4px 0;color:var(--muted);font-size:14px}
.p-hero{padding-inline:16px;display:grid;gap:14px}
.p-hero .thumb{aspect-ratio:4/3;border-radius:16px}
.p-hero .glyph{font-size:20px}
.p-hero h1{font-size:22px;margin-top:2px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;padding:14px 0;border-block:1px solid var(--line);font-size:13.5px}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-variant-numeric:tabular-nums}
.opt{display:grid;gap:5px}
.opt label{font-size:12.5px;color:var(--muted)}
.opt select{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.actions{display:grid;gap:8px}
.note{font-size:12px;color:var(--muted);margin:0}
.empty{padding:0 16px;font-size:13px;color:var(--muted)}

/* 문의 */
.contact{padding-inline:16px;display:grid;gap:12px}
.ways{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.way{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px;text-align:left}
.way span{font-size:11.5px;color:var(--muted)}
.way b{font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.way small{font-size:11px;color:var(--accent)}
form.inq{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
form.inq label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
form.inq input,form.inq select,form.inq textarea{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--ground);color:var(--ink);font:inherit;font-size:16px;width:100%}
form.inq textarea{min-height:96px;resize:vertical}
.ok{color:var(--accent);font-size:13px;font-weight:500;margin:0}

footer{padding:28px 16px 8px;font-size:11.5px;color:var(--muted);display:grid;gap:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;text-decoration:none;width:100%}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.store{background:var(--store);border-color:var(--store);color:var(--store-ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--ground) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar-inner{max-width:488px;margin:0 auto;display:grid;grid-template-columns:1fr 1.3fr;gap:8px}
.bar .btn{padding:11px 12px}

.toast{position:fixed;left:50%;bottom:calc(var(--bar-h) + env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:8px 14px;border-radius:999px;font-size:13px;z-index:60}
.loading{padding:40px 16px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="#" data-home>
      <span class="mark"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 14s-5.5-3.3-5.5-7.2A3 3 0 0 1 8 5a3 3 0 0 1 5.5 1.8C13.5 10.7 8 14 8 14Z" fill="var(--accent-ink)"/></svg></span>
      <span id="brand-name">라이프케어서비스</span>
    </a>
    <div class="top-links">
      <a class="pill" id="blog-link" target="_blank" rel="noopener">블로그</a>
      <a class="pill" id="store-link" target="_blank" rel="noopener">스토어</a>
    </div>
  </header>

  <div id="view"><p class="loading">불러오는 중…</p></div>

  <section class="sec" id="contact">
    <div class="sec-head"><h2>문의하기</h2></div>
    <div class="contact">
      <div class="ways">
        <button class="way" type="button" id="copy-phone"><span>전화 상담</span><b id="phone"></b><small>눌러서 번호 복사</small></button>
        <button class="way" type="button" id="copy-kakao"><span>카카오톡 채널</span><b id="kakao"></b><small>눌러서 복사</small></button>
      </div>
      <form class="inq" id="inq">
        <label for="f-name">이름<input id="f-name" required placeholder="홍길동" autocomplete="name"></label>
        <label for="f-phone">연락처<input id="f-phone" required inputmode="tel" placeholder="010-0000-0000" autocomplete="tel"></label>
        <label for="f-type">문의 종류<select id="f-type"><option>상품 문의</option><option>설치·납품 견적</option><option>렌탈 상담</option><option>기타</option></select></label>
        <label for="f-msg">내용<textarea id="f-msg" placeholder="궁금한 점을 적어 주세요"></textarea></label>
        <button class="btn primary" type="submit">문의 남기기</button>
        <p class="ok" id="f-ok" hidden>접수 기능은 준비 중이에요. 급한 문의는 전화나 카카오톡으로 연락 주세요.</p>
      </form>
    </div>
  </section>

  <footer><div id="business"></div><div>이용약관 · 개인정보처리방침</div></footer>
</div>

<div class="bar"><div class="bar-inner">
  <a class="btn" href="#contact" data-contact>문의하기</a>
  <a class="btn store" id="bar-store" target="_blank" rel="noopener">스마트스토어 가기</a>
</div></div>
<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
